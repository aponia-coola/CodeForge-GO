<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeForge · 设置布局重构（5 套）</title>
<!--
  重构说明
  - 单一数据源 SECTIONS：9 个设置页 + 全部控件（开关/滑条/数字/下拉/分段/表单/列表），与原 settings-ui-export.html 一一对应，不增不减。
  - A 分组侧栏（Codex 风）：左分组导航 + 单列设置行，控件靠右。
  - B 主从双栏（Z.ai 风）：左导航 + 左条目列 / 右详情表单。
  - C 顶部标签：顶部横排标签 + 双列卡片网格。
  - D 图标窄栏：68px 图标栏 + 单列堆叠表单（控件全宽）。
  - E 单页画布：无左导航，一页到底 + 右侧锚点目录。
-->
<style>
:root{
  --bg:#fff;--side:#fafbfc;--elev:#f1f3f6;--line:#e6e8ee;--line2:#eef0f4;
  --text:#171a21;--dim:#6b7280;--dim2:#98a0ad;--accent:#4373f5;--accent2:#eef2fe;
  --ok:#16a34a;--ok2:#e8f7ee;--danger:#dc2626;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3{margin:0;font-weight:600}
.mono{font-family:var(--mono)}
/* 预览壳 */
.stagebar{height:52px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;background:#171a21;color:#fff}
.sb-title{font-size:13px;font-weight:600;white-space:nowrap}
.sb-tabs{display:flex;gap:4px;flex:1;overflow-x:auto}
.sb-tab{border:none;background:rgba(255,255,255,.08);color:#c9cfdb;height:30px;padding:0 12px;border-radius:8px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
.sb-tab:hover{background:rgba(255,255,255,.16);color:#fff}
.sb-tab.on{background:#fff;color:#171a21;font-weight:600}
.sb-check{font-size:12px;color:#8ee0a8;white-space:nowrap;background:rgba(22,163,74,.16);padding:4px 10px;border-radius:999px}
#stage{height:calc(100vh - 52px);overflow:hidden;background:var(--bg)}
/* 通用 */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.grp{font-size:13px;font-weight:600;color:var(--dim);margin:26px 0 8px}
.head h1{font-size:22px;letter-spacing:-.2px}
.head p{margin:6px 0 0;color:var(--dim);font-size:13px}
.rows{display:flex;flex-direction:column}
.rw{display:flex;align-items:center;gap:18px;padding:13px 16px;border-top:1px solid var(--line2)}
.rows>.rw:first-child{border-top:none}
.m{display:flex;flex:1;min-width:0}
.t{font-size:13.5px;font-weight:500}
.d{font-size:12.5px;color:var(--dim);margin-top:2px}
.ctl{flex:none;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.ctl.grow{flex:1;max-width:420px}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--elev);color:var(--dim);margin-left:6px;vertical-align:1px}
.tag.ok{background:var(--ok2);color:var(--ok)}
.tag.bl{background:var(--accent2);color:var(--accent)}
.val{font-size:12.5px;color:var(--dim);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
.note{font-size:12.5px;color:var(--dim2)}
/* 开关 */
.sw{position:relative;display:inline-block;width:42px;height:24px;flex:none;cursor:pointer}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:999px;background:#dfe3ea;transition:background .18s}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(20,25,40,.22);transition:transform .18s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(18px)}
/* 滑条 */
.sld{display:flex;align-items:center;gap:10px;min-width:230px}
.sld input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:999px;background:#e6e9ef;outline:none;margin:0;cursor:pointer}
.sld input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:1.5px solid var(--accent);box-shadow:0 1px 3px rgba(20,25,40,.2)}
.sld input::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;border:1.5px solid var(--accent)}
.sld .v{font-size:12.5px;color:var(--dim);min-width:48px;text-align:right}
/* 分段 */
.seg{display:inline-flex;background:var(--elev);border-radius:10px;padding:2px;gap:2px}
.seg button{border:none;background:transparent;height:28px;padding:0 13px;border-radius:8px;font:inherit;font-size:12.5px;color:var(--dim);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(20,25,40,.1)}
/* 按钮 */
.btn{height:34px;padding:0 14px;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#f7f8fa}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#3563e0}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.dg{color:var(--danger)}.btn.dg:hover{background:#fdf1f1;border-color:#f5c9c9}
.bs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rsp{font-size:12px;color:var(--ok)}.rsp.e{color:var(--danger)}
/* 输入 */
.inp{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;padding:0 11px;font:inherit;font-size:13px;background:#fff;color:var(--text)}
.inp::placeholder{color:var(--dim2)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
.inp.n{width:96px}
.mini{display:flex;align-items:center;gap:8px;flex:none}
.mini .lb{font-size:12.5px;color:var(--dim);white-space:nowrap}
select.inp{appearance:none;-webkit-appearance:none;padding-right:30px;cursor:pointer}
.sel{position:relative;display:block}
.sel svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
.form{padding:14px 16px;display:flex;flex-direction:column;gap:13px}
.f{display:flex;flex-direction:column;gap:6px}
.f>.lb{font-size:12.5px;color:var(--dim)}
.irow{display:flex;gap:8px;align-items:center}
.irow .inp{flex:1}
.np{display:flex;gap:14px;flex-wrap:wrap}
.np label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim)}
.np .inp{width:120px}
.foot{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line2);background:#fcfcfd}
.foot .rsp{margin-right:auto}
/* 列表 */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line2);font-size:13px}
.li:first-child{border-top:none}
.lm{flex:1;min-width:0}
.ln{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px}
.ln .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.ln .dot.o{background:#d3d8e0}
.ls{font-size:12px;color:var(--dim);margin-top:2px;word-break:break-all}
.ltext{flex:1;color:var(--text);word-break:break-all}
.lmeta{font-size:11.5px;color:var(--dim2);flex:none}
.add{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--line2)}
.add .inp{flex:1}
/* 发现面板 */
.pnl{margin:0 16px 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pnl-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fcfcfd;border-bottom:1px solid var(--line2)}
.pnl-t{font-size:13px;font-weight:600;flex:none}
.pnl-t .tag{margin-left:6px}
.pnl-s{display:flex;gap:8px;flex:1;justify-content:flex-end}
.pnl-s .inp{max-width:180px;height:30px;font-size:12.5px}
.pnl-l{max-height:190px;overflow:auto}
.pnl-l .pi{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:13px;border-top:1px solid var(--line2)}
.pnl-l .pi:first-child{border-top:none}
.pi input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.pi .id{flex:1;font-family:var(--mono);font-size:12.5px}
.pnl-f{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:10px 12px;border-top:1px solid var(--line2);background:#fcfcfd}
.pnl-f .rsp{margin-right:auto}
/* 标签页 */
.tb{display:flex;gap:2px;margin-bottom:14px;background:var(--elev);border-radius:10px;padding:3px;width:max-content}
.tb button{border:none;background:transparent;height:30px;padding:0 14px;border-radius:8px;font:inherit;font-size:12.5px;color:var(--dim);cursor:pointer}
.tb button.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(20,25,40,.1)}
.pane{display:none}.pane.on{display:block}
/* ===== A 分组侧栏 ===== */
.lA,.lB,.lD{display:flex;height:100%}
.sA{width:262px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto}
.ni{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border:none;background:transparent;border-radius:9px;font:inherit;font-size:13.5px;color:var(--text);cursor:pointer}
.ni:hover{background:var(--elev)}
.ni.on{background:#e7eaef;font-weight:600}
.ni svg{color:var(--dim);flex:none}.ni.on svg{color:var(--text)}
.ng{font-size:11.5px;color:var(--dim2);padding:14px 10px 4px;letter-spacing:.4px}
.mA{flex:1;overflow-y:auto;padding:40px 48px 90px}
.mA .w{max-width:920px;margin:0 auto}
.mA .card+.grp{margin-top:30px}
/* ===== B 主从双栏 ===== */
.sB{width:236px;padding:14px 10px;background:var(--side);border-right:1px solid var(--line);overflow-y:auto}
.mB{flex:1;display:flex;flex-direction:column;overflow:hidden}
.hB{padding:30px 40px 18px;border-bottom:1px solid var(--line)}
.hB h1{font-size:21px}.hB p{margin:6px 0 0;font-size:13px;color:var(--dim)}
.bB{flex:1;overflow:auto;padding:22px 40px 60px}
.md{display:grid;grid-template-columns:220px minmax(0,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:440px;background:#fff}
.mdl{background:var(--side);border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:2px}
.mdi{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;border:none;background:transparent;border-radius:9px;font:inherit;font-size:13px;color:var(--text);cursor:pointer}
.mdi:hover{background:var(--elev)}
.mdi.on{background:#e7eaef;font-weight:600}
.mdi .dd{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.mdi .dd.o{background:#d3d8e0}
.mdi.on .dd{background:var(--accent)}
/* 供应商分组 / 管理 */
.sg{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fcfcfd;border-bottom:1px solid var(--line2);font-size:12px;font-weight:600;color:var(--dim)}
.sg .n{flex:1}
.sg .cnt{font-weight:400;color:var(--dim2)}
.mdd{padding:18px 20px 22px;min-width:0}
.mdt{font-size:13px;font-weight:600;color:var(--dim);margin-bottom:10px}
.mdd .card{border:none;border-radius:0}
.mdd .rw{align-items:stretch;flex-direction:column;gap:8px;padding:13px 2px}
.mdd .ctl{justify-content:flex-start;width:100%}
.mdd .ctl,.mdd .sld{width:100%;max-width:none}
.mdd .form{padding:6px 2px}
.mdd .li{padding:12px 2px}
.mdd .add{padding:12px 2px}
.mdd .pnl{margin:6px 2px 8px}
/* ===== C 顶部标签 ===== */
.lC{display:flex;flex-direction:column;height:100%}
.tC{height:54px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}
.tt{display:flex;gap:2px;flex:1;overflow-x:auto;padding:0 4px}
.tt button{border:none;background:transparent;height:32px;padding:0 12px;border-radius:9px;font:inherit;font-size:13px;color:var(--dim);cursor:pointer;white-space:nowrap}
.tt button:hover{background:var(--elev);color:var(--text)}
.tt button.on{background:var(--elev);color:var(--text);font-weight:600}
.bC{flex:1;overflow:auto;padding:28px 32px 70px}
.gC{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:16px;align-items:start;max-width:1060px;margin:0 auto}
/* ===== D 图标窄栏 ===== */
.rD{width:68px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0}
.rb{width:44px;height:40px;border:none;background:transparent;border-radius:11px;display:grid;place-items:center;color:var(--dim);cursor:pointer}
.rb:hover{background:var(--elev);color:var(--text)}
.rb.on{background:var(--accent2);color:var(--accent)}
.mD{flex:1;overflow:auto;padding:36px 0 80px}
.mD .w{max-width:800px;margin:0 auto;padding:0 32px}
.mD .rw{flex-direction:column;align-items:stretch;gap:9px}
.mD .rw.k-switch,.mD .rw.k-static{flex-direction:row;align-items:center}
.mD .ctl{width:100%;justify-content:flex-start}
.mD .ctl.grow{max-width:none}
.mD .sld{width:100%}
.mD .card+.grp{margin-top:26px}
/* ===== E 单页画布 ===== */
.lE{display:flex;height:100%}
.me{flex:1;overflow:auto;padding:0 0 100px}
.tp{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 48px;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tocw{width:196px;flex:none;border-left:1px solid var(--line);background:var(--side);padding:26px 12px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.tl{font-size:11.5px;color:var(--dim2);letter-spacing:.4px;padding:0 10px 8px}
.ti{border:none;background:transparent;text-align:left;padding:7px 10px;border-radius:8px;font:inherit;font-size:13px;color:var(--dim);cursor:pointer}
.ti:hover{background:var(--elev);color:var(--text)}
.ti.on{background:#e7eaef;color:var(--text);font-weight:600}
.me .w{max-width:740px;margin:0 auto;padding:26px 48px 0}
.sec{padding-top:22px}
.sec+.sec{border-top:1px solid var(--line);margin-top:34px;padding-top:30px}
.sec h2{font-size:19px;letter-spacing:-.2px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:#171a21;color:#fff;font-size:12.5px;padding:8px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:99}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="stagebar">
  <span class="sb-title">设置布局重构预览</span>
  <div class="sb-tabs" id="tabs">
    <button class="sb-tab on" data-l="a">A · 分组侧栏</button>
    <button class="sb-tab" data-l="b">B · 主从双栏</button>
    <button class="sb-tab" data-l="c">C · 顶部标签</button>
    <button class="sb-tab" data-l="d">D · 图标窄栏</button>
    <button class="sb-tab" data-l="e">E · 单页画布</button>
  </div>
  <span class="sb-check" id="chk"></span>
</div>
<div id="stage"></div>
<div class="toast" id="toast"></div>

 SEC.forEach(function(s){(g[s.group]=g[s.group]||[]).push(s);});
 var nav='<aside class="sA"><button class="ni" data-demo="返回工作区（示例）" data-fn>'+ic('back')+'<span>返回</span></button>'+Object.keys(g).map(function(k){
  return '<div class="ng">'+k+'</div>'+g[k].map(function(s){
   return '<button class="ni" data-nav="'+s.id+'">'+ic(s.icon)+'<span>'+s.label+'</span></button>';}).join('');
 }).join('')+'</aside>';
 var pages=SEC.map(function(s){
  return '<section class="pageA" data-page="'+s.id+'" hidden>'+secHead(s)+'<div style="margin-top:20px">'+blocksHTML(s)+'</div></section>';}).join('');
 return '<div class="lA">'+nav+'<main class="mA"><div class="w">'+pages+'</div></main></div>';
}
/* ===== 布局 B：主从双栏 ===== */
function layoutB(){
 var g={};
 SEC.forEach(function(s){(g[s.group]=g[s.group]||[]).push(s);});
 var nav='<aside class="sB"><button class="ni" data-demo="返回工作区（示例）" data-fn>'+ic('back')+'<span>返回</span></button>'+Object.keys(g).map(function(k){
  return '<div class="ng">'+k+'</div>'+g[k].map(function(s){return '<button class="ni" data-nav="'+s.id+'">'+ic(s.icon)+'<span>'+s.label+'</span></button>';}).join('');
 }).join('')+'</aside>';
 function detailInner(sec){
  if(sec.tabs)return blocksHTML(sec);
  var parts=[];
  sec.blocks.forEach(function(b){
   if(b.type==='rows')parts.push('<div class="mdt">'+b.label+'</div><div class="card"><div class="rows">'+b.rows.filter(function(r){return r.kind!=='note';}).map(function(r){return rowHTML(r);}).join('')+'</div>'+(b.rows.some(function(r){return r.kind==='note';})?'<div style="padding:10px 16px;border-top:1px solid var(--line2)">'+b.rows.filter(function(r){return r.kind==='note';}).map(function(n){return '<div class="note">'+n.desc+'</div>';}).join('')+'</div>':'')+'</div>');
   else if(b.type==='addlist')parts.push('<div class="mdt">'+b.label+'</div><div class="add" style="padding:12px 2px"><input class="inp" type="text" placeholder="'+b.ph+'" data-fn><button class="btn primary sm" data-demo="已添加记忆（示例）" data-fn>添加</button></div><div class="list">'+listHTML(b.list)+'</div>');
   else if(b.type==='list')parts.push('<div class="mdt">'+b.label+'</div>'+(b.note?'<div class="note" style="margin-bottom:6px">'+b.note+'</div>':'')+'<div class="list">'+listHTML(b.list)+'</div>');
  });
  return parts.join('');
 }
 var pages=SEC.map(function(s){
  var inner=detailInner(s);
  var entries;
  if(s.tabs){
   entries=s.blocks.map(function(b,i){return '<button class="mdi'+(i===0?' on':'')+'" data-demo="查看「'+b.label+'」（示例）" data-fn><span class="dd"></span>'+b.label+'</button>';}).join('');
  }else{
   entries='<button class="mdi on" data-nav="'+s.id+'"><span class="dd"></span>'+s.label+'</button>';
  }
  return '<section class="pageB" data-page="'+s.id+'" hidden><div class="head" style="margin-bottom:16px"><h1>'+s.label+'</h1><p>'+s.desc+'</p></div><div class="md"><div class="mdl">'+entries+'</div><div class="mdd">'+inner+'</div></div></section>';}).join('');
 return '<div class="lB">'+nav+'<main class="mB"><div class="bB">'+pages+'</div></main></div>';
}
/* ===== 布局 C：顶部标签 ===== */
function layoutC(){
 var tabs=SEC.map(function(s,i){return '<button class="'+(i===0?'on':'')+'" data-nav="'+s.id+'">'+s.label+'</button>';}).join('');
 var panes=SEC.map(function(s,i){
  var body=blocksHTML(s);
  return '<section class="pageC" data-page="'+s.id+'" '+(i===0?'':'hidden')+'>'+body+'</section>';}).join('');
 return '<div class="lC"><div class="tC"><button class="ni" style="width:auto" data-demo="返回工作区（示例）" data-fn>'+ic('back')+'<span>返回</span></button><div class="tt">'+tabs+'</div></div><main class="bC">'+panes+'</main></div>';
}
/* ===== 布局 D：图标窄栏 ===== */
function layoutD(){
 var rail='<aside class="rD"><button class="rb" style="width:44px;height:32px" data-demo="返回工作区（示例）" data-fn title="返回">'+ic('back')+'</button>'+
  SEC.map(function(s,i){return '<button class="rb'+(i===0?' on':'')+'" data-nav="'+s.id+'" title="'+s.label+'">'+ic(s.icon,17)+'</button>';}).join('')+'</aside>';
 var pages=SEC.map(function(s,i){
  return '<section class="pageD" data-page="'+s.id+'" '+(i===0?'':'hidden')+'>'+secHead(s)+'<div style="margin-top:20px">'+blocksHTML(s)+'</div></section>';}).join('');
 return '<div class="lD">'+rail+'<main class="mD"><div class="w">'+pages+'</div></main></div>';
}
/* ===== 布局 E：单页画布 ===== */
function layoutE(){
 var toc='<aside class="tocw"><div class="tl">设置目录</div>'+SEC.map(function(s,i){return '<button class="ti'+(i===0?' on':'')+'" data-anchor="'+s.id+'">'+ic(s.icon,13)+' '+s.label+'</button>';}).join('')+'</aside>';
 var secs=SEC.map(function(s){return '<div class="sec" id="sec-'+s.id+'"><h2>'+s.label+'</h2><p class="d" style="margin:4px 0 18px">'+s.desc+'</p>'+blocksHTML(s)+'</div>';}).join('');
 return '<div class="lE"><main class="me" id="me"><div class="tp"><button class="ni" style="width:auto" data-demo="返回工作区（示例）" data-fn>'+ic('back')+'<span>返回</span></button><b style="font-size:15px">设置</b></div><div class="w">'+secs+'</div></main>'+toc+'</div>';
}
/* ===== 装配与事件 ===== */
var stage=document.getElementById('stage');
var LAYOUTS={a:layoutA,b:layoutB,c:layoutC,d:layoutD,e:layoutE};
var state={layout:'a'};
function mount(key){
 state.layout=key;
 stage.innerHTML=LAYOUTS[key]();
 var firstNav=stage.querySelector('[data-nav]');
 if(firstNav)activate(firstNav.dataset.nav);
 var firstRb=stage.querySelector('.rb[data-nav]');
 if(firstRb)firstRb.classList.add('on');
 wire();
}
function activate(id){
 stage.querySelectorAll('.pageA,.pageB,.pageC,.pageD').forEach(function(p){p.hidden=p.dataset.page!==id;});
 stage.querySelectorAll('.ni[data-nav]').forEach(function(n){n.classList.toggle('on',n.dataset.nav===id);});
 if(state.layout==='d'){
  stage.querySelectorAll('.rb[data-nav]').forEach(function(n){n.classList.toggle('on',n.dataset.nav===id);});
 }
 if(state.layout==='e'){
  stage.querySelectorAll('.ti').forEach(function(t){t.classList.toggle('on',t.dataset.anchor===id);});
 }
}
var toastEl=document.getElementById('toast'),toastT;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('on');},1400);}
function wire(){
 stage.querySelectorAll('[data-nav]').forEach(function(n){
  n.addEventListener('click',function(){
   var id=n.dataset.nav;
   activate(id);
   if(state.layout==='e'){
    var sec=document.getElementById('sec-'+id);
    var me=document.getElementById('me');
    if(sec&&me)me.scrollTop=sec.offsetTop-me.querySelector('.tp').offsetHeight;
   }
  });
 });
 stage.querySelectorAll('[data-anchor]').forEach(function(t){
  t.addEventListener('click',function(){
   var sec=document.getElementById('sec-'+t.dataset.anchor);
   var me=document.getElementById('me');
   if(sec&&me)me.scrollTop=sec.offsetTop-me.querySelector('.tp').offsetHeight;
   activate(t.dataset.anchor);
  });
 });
 stage.querySelectorAll('input[type=range]').forEach(function(r){
  var out=r.parentElement.querySelector('.v');
  r.addEventListener('input',function(){out.textContent=r.value+(out.textContent.replace(/-?\d+/,'').trim()==='%'?'%':out.textContent.replace(/-?\d+/,''));});
 });
 stage.querySelectorAll('[data-eye]').forEach(function(b){
  b.addEventListener('click',function(){var i=b.parentElement.querySelector('input');if(!i){toast('已切换显示（示例）');return;}i.type=i.type==='password'?'text':'password';});
 });
 stage.querySelectorAll('[data-demo]').forEach(function(b){
  b.addEventListener('click',function(){toast(b.dataset.demo);});
 });
 stage.querySelectorAll('[data-save]').forEach(function(b){
  b.addEventListener('click',function(){
   var p=b.dataset.save.split('|'),slot=p[0],msg=p[1];
   var out=stage.querySelector('[data-slot="'+slot+'"]');
   if(out){out.textContent=msg;out.classList.remove('e');setTimeout(function(){out.textContent='';},1600);}
   toast(msg);
  });
 });
 stage.querySelectorAll('.seg').forEach(function(seg){
  seg.querySelectorAll('button').forEach(function(b){
   b.addEventListener('click',function(){
    seg.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');
   });
  });
 });
 stage.querySelectorAll('[data-pane]').forEach(function(b){
  b.addEventListener('click',function(){
   var id=b.dataset.pane;
   var pane=document.getElementById(id);
   if(!pane)return;
   pane.classList.add('on');
   var sib=pane.parentElement.querySelectorAll(':scope>.pane');
   sib.forEach(function(p){p.classList.toggle('on',p===pane);});
   b.parentElement.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);});
  });
 });
 /* 供应商管理：切换左侧供应商，重绘右侧详情 */
 stage.querySelectorAll('[data-sup]').forEach(function(b){
  b.addEventListener('click',function(){
   stage.querySelectorAll('[data-sup]').forEach(function(x){x.classList.toggle('on',x===b);});
   var d=stage.querySelector('[data-supdetail]');
   if(d)d.innerHTML=supDetailHTML(SUP[+b.dataset.sup]);
  });
 });
 stage.querySelectorAll('[data-seg="key"] button').forEach(function(b){
  b.addEventListener('click',function(){
   var f=b.closest('.f');
   var env=f.querySelector('.kenv'),plain=f.querySelector('.kplain');
   var useEnv=b.textContent==='环境变量';
   if(env)env.hidden=!useEnv;
   if(plain)plain.hidden=useEnv;
  });
 });
}
/* 统计功能点：控件 + 操作按钮（5 套布局同源同数） */
function countFns(){
 var n=0;
 SEC.forEach(function(s){
  s.blocks.forEach(function(b){
   if(b.type==='rows')b.rows.forEach(function(r){
    if(r.kind==='static'||r.kind==='switch'||r.kind==='slider'||r.kind==='number'||r.kind==='select'||r.kind==='seg')n++;
    if(r.kind==='buttons')n+=r.buttons.length;
    if(r.kind==='note')n++;
   });
   if(b.type==='supplierlist'){SUP.forEach(function(sp){n+=sp.models.length;});n+=SUP.length;}
   if(b.type==='suppliers'){SUP.forEach(function(sp){n+=sp.models.length+4;});}
   if(b.type==='list')n+=(ITEMS[b.list]||[]).length+1;
   if(b.type==='addlist')n+=(ITEMS[b.list]||[]).length+1;
   if(b.type==='form'){n+=b.fields.length;n+=b.actions.length;if(b.discover)n+=1;}
  });
 });
 return n;
}
document.getElementById('chk').textContent='功能点 '+countFns()+' · 与原界面一致';
document.getElementById('tabs').addEventListener('click',function(e){
 var b=e.target.closest('.sb-tab');if(!b)return;
 document.querySelectorAll('.sb-tab').forEach(function(x){x.classList.toggle('on',x===b);});
 mount(b.dataset.l);
});
mount('a');
})();
</script>
</body>
