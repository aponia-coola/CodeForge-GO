<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeForge · 设置重构（分组分类 + 供应商机制）</title>
<!--
  重构说明
  ─────────────────────────────────────────────────────────────
  1. 分类（信息架构）：沿用 new_setting.html 的三分组，把当前 9 个设置页归位
       个人：常规 / 模型 / 外观
       扩展：记忆 / 技能 / 插件 / 子智能体 / MCP 服务
       数据：归档
     页面内容与控件与原界面一一对应，不增不减（只重排、不改语义）。

  2. 模型页新增「供应商（Provider）机制」——本次重构的核心
     现状（config/models.yaml）：base_url / key_value 被复制到每条模型条目上，
       同一网关下加第 N 个模型 = 把地址和密钥再抄一遍。
     重构后：
       供应商 = { 名称, Base URL, API 格式, API Key, 启用 }        ← 只维护一份
       模型   = { 归属供应商, 模型 id, 显示名, 上下文, 启用 }        ← 只填 id
     由此得到三个能力：
       · 同供应商切换模型：点「设为当前」即可换 id，不动 Key / URL
       · 新增模型：选已有供应商 → 地址与密钥自动继承，只填 id
       · 批量添加：从上游 /models 勾选多个 id，一次写入同一供应商
  ─────────────────────────────────────────────────────────────
-->
<style>
:root{
  --bg:#fff;--side:#fafbfc;--elev:#f1f3f6;--line:#e6e8ee;--line2:#eef0f4;
  --text:#171a21;--dim:#6b7280;--dim2:#98a0ad;--accent:#4373f5;--accent2:#eef2fe;
  --ok:#16a34a;--ok2:#e8f7ee;--danger:#dc2626;--warn:#b45309;--warn2:#fdf6ec;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3{margin:0;font-weight:600}
code,.mono{font-family:var(--mono)}
.dim{color:var(--dim)}

/* 顶栏 */
.topbar{height:50px;flex:none;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:#fff}
.tb-t{font-size:14px;font-weight:600}
.tb-sub{font-size:12px;color:var(--dim2)}
.tb-cur{margin-left:auto;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:7px;background:var(--elev);padding:5px 11px;border-radius:999px}
.tb-cur b{color:var(--text);font-weight:600}
.tb-cur .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}

/* 主体 */
.app{flex:1;display:flex;min-height:0}
.nav{width:236px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:12px 10px;overflow-y:auto}
.nav-back{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border:none;background:transparent;border-radius:9px;font:inherit;font-size:13.5px;color:var(--text);cursor:pointer;margin-bottom:6px}
.nav-back:hover{background:var(--elev)}
.ng{font-size:11.5px;color:var(--dim2);padding:14px 10px 5px;letter-spacing:.4px}
.ni{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border:none;background:transparent;border-radius:9px;font:inherit;font-size:13.5px;color:var(--text);cursor:pointer}
.ni:hover{background:var(--elev)}
.ni.on{background:#e7eaef;font-weight:600}
.ni svg{color:var(--dim);flex:none}
.ni.on svg{color:var(--text)}
.main{flex:1;overflow-y:auto;padding:32px 44px 90px;min-width:0}
.w{max-width:940px;margin:0 auto}

/* 通用块 */
.head h1{font-size:22px;letter-spacing:-.2px}
.head p{margin:6px 0 0;color:var(--dim);font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.grp{font-size:13px;font-weight:600;color:var(--dim);margin:26px 0 8px}
.grp:first-child{margin-top:18px}
.rows{display:flex;flex-direction:column}
.rw{display:flex;align-items:center;gap:18px;padding:13px 16px;border-top:1px solid var(--line2)}
.rows>.rw:first-child{border-top:none}
.m{flex:1;min-width:0}
.t{font-size:13.5px;font-weight:500}
.d{font-size:12.5px;color:var(--dim);margin-top:2px}
.ctl{flex:none;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.ctl.grow{flex:1;max-width:420px}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--elev);color:var(--dim);margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.ok{background:var(--ok2);color:var(--ok)}
.tag.bl{background:var(--accent2);color:var(--accent)}
.tag.wr{background:var(--warn2);color:var(--warn)}
.val{font-size:12.5px;color:var(--dim);max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
.note{font-size:12.5px;color:var(--dim2)}

/* 开关 */
.sw{position:relative;display:inline-block;width:42px;height:24px;flex:none;cursor:pointer}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:999px;background:#dfe3ea;transition:background .18s}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(20,25,40,.22);transition:transform .18s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(18px)}

/* 滑条 */
.sld{display:flex;align-items:center;gap:10px;min-width:240px}
.sld input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:999px;background:#e6e9ef;outline:none;margin:0;cursor:pointer}
.sld input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:1.5px solid var(--accent);box-shadow:0 1px 3px rgba(20,25,40,.2)}
.sld input::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;border:1.5px solid var(--accent)}
.sld .v{font-size:12.5px;color:var(--dim);min-width:52px;text-align:right}

/* 分段 / 按钮 */
.seg{display:inline-flex;background:var(--elev);border-radius:10px;padding:2px;gap:2px}
.seg button{border:none;background:transparent;height:28px;padding:0 13px;border-radius:8px;font:inherit;font-size:12.5px;color:var(--dim);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(20,25,40,.1)}
.btn{height:34px;padding:0 14px;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#f7f8fa}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#3563e0}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.dg{color:var(--danger)}
.btn.dg:hover{background:#fdf1f1;border-color:#f5c9c9}
.bs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.rsp{font-size:12px;color:var(--ok)}
.sp{flex:1}

/* 输入 */
.inp{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;padding:0 11px;font:inherit;font-size:13px;background:#fff;color:var(--text)}
.inp::placeholder{color:var(--dim2)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
.inp.n{width:96px}
.inp[readonly]{background:#f7f8fa;color:var(--dim);cursor:default}
.mini{display:flex;align-items:center;gap:8px;flex:none}
.mini .lb{font-size:12.5px;color:var(--dim);white-space:nowrap}
select.inp{appearance:none;-webkit-appearance:none;padding-right:30px;cursor:pointer}
.sel{position:relative;display:block}
.sel svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
.form{padding:16px;display:flex;flex-direction:column;gap:13px}
.f{display:flex;flex-direction:column;gap:6px}
.f>.lb{font-size:12.5px;color:var(--dim)}
.irow{display:flex;gap:8px;align-items:center}
.irow .inp{flex:1}
.np{display:flex;gap:14px;flex-wrap:wrap}
.np label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim)}
.np .inp{width:120px}
.foot{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line2);background:#fcfcfd}
.foot .rsp{margin-right:auto}

/* 列表 */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line2);font-size:13px}
.li:first-child{border-top:none}
.lm{flex:1;min-width:0}
.ln{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ln .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.ln .dot.o{background:#d3d8e0}
.ls{font-size:12px;color:var(--dim);margin-top:2px;word-break:break-all}
.ltext{flex:1;word-break:break-all}
.lmeta{font-size:11.5px;color:var(--dim2);flex:none}
.empty{padding:18px 16px;font-size:12.5px;color:var(--dim2);border-top:1px solid var(--line2)}
.add{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--line2)}
.add .inp{flex:1}

/* 标签页 */
.tabs{display:flex;gap:2px;margin:18px 0 14px;background:var(--elev);border-radius:10px;padding:3px;width:max-content}
.tabs button{border:none;background:transparent;height:30px;padding:0 14px;border-radius:8px;font:inherit;font-size:12.5px;color:var(--dim);cursor:pointer}
.tabs button.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(20,25,40,.1)}

/* ===== 供应商：主从双栏 ===== */
.md{display:grid;grid-template-columns:230px minmax(0,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:460px;background:#fff}
.mdl{background:var(--side);border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:2px}
.mdi{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;border:none;background:transparent;border-radius:9px;font:inherit;font-size:13px;color:var(--text);cursor:pointer}
.mdi:hover{background:var(--elev)}
.mdi.on{background:#e7eaef;font-weight:600}
.mdi .dd{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.mdi .dd.o{background:#d3d8e0}
.mdi .cnt{margin-left:auto;font-size:11px;color:var(--dim2);font-weight:400}
.mdi.addprov{color:var(--accent);font-weight:600}
.mdd{padding:18px 20px 22px;min-width:0}
.mdt{font-size:13px;font-weight:600;color:var(--dim);margin-bottom:10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mdt .sub{font-weight:400;font-size:12px;color:var(--dim2)}

/* 供应商机制说明条 */
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--accent2);border:1px solid #dbe4fd;border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:12.5px;color:#2c4a9e;line-height:1.6}
.banner b{color:#1e3a8a}
.banner svg{flex:none;margin-top:2px;color:var(--accent)}

/* 继承块（添加模型时复用供应商配置） */
.inherit{border:1px dashed #cdd8f7;background:#f7f9ff;border-radius:11px;padding:11px 13px}
.inherit .ih{font-size:12.5px;color:#2c4a9e;margin-bottom:8px}
.inherit .ih b{color:#1e3a8a}
.inherit .ir{display:flex;gap:10px;font-size:12.5px;padding:4px 0;align-items:center}
.inherit .ir>span{width:78px;color:var(--dim);flex:none}
.inherit .ir code{font-size:12px;color:var(--text);word-break:break-all}

/* 供应商分组头（模型列表页） */
.pg{display:flex;align-items:center;gap:9px;padding:10px 16px;background:#fcfcfd;border-top:1px solid var(--line2);font-size:12.5px;flex-wrap:wrap}
.pg:first-child{border-top:none}
.pg svg{color:var(--dim);flex:none}
.pg b{font-size:13px}
.pg code{font-size:11.5px;color:var(--dim2)}

/* 上游发现面板 */
.pnl{margin:12px 0 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pnl-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fcfcfd;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.pnl-t{font-size:13px;font-weight:600;flex:none}
.pnl-s{display:flex;gap:8px;flex:1;justify-content:flex-end}
.pnl-s .inp{max-width:180px;height:30px;font-size:12.5px}
.pnl-l{max-height:200px;overflow:auto}
.pi{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:13px;border-top:1px solid var(--line2);cursor:pointer}
.pi:first-child{border-top:none}
.pi:hover{background:#fafbfc}
.pi input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;flex:none}
.pi .id{flex:1;font-family:var(--mono);font-size:12.5px}
.pi .own{font-size:11px;color:var(--dim2)}
.pnl-f{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:10px 12px;border-top:1px solid var(--line2);background:#fcfcfd}
.pnl-f .rsp{margin-right:auto}

/* 密钥行 */
.keyseg{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.keyseg .seg{flex:none}
.keyseg .inp{flex:1;min-width:200px}
.eye{width:34px;height:34px;flex:none;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;font-size:14px;line-height:1}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:#171a21;color:#fff;font-size:12.5px;padding:8px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:99}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="topbar">
  <span class="tb-t">设置</span>
  <span class="tb-sub">个人 / 扩展 / 数据 三分类 · 模型页启用供应商机制</span>
  <span class="tb-cur"><span class="dot"></span>当前模型 <b id="cur-model-label">—</b></span>
</div>

<div class="app">
  <aside class="nav" id="nav"></aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ============================ 图标 ============================ */

  gear:'<circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/>',
  cube:'<path d="M12 2.6 20.5 7v10L12 21.4 3.5 17V7z"/><path d="M3.5 7 12 11.6 20.5 7M12 11.6v9.8"/>',

  puzzle:'<path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.2"/>',
  nodes:'<circle cx="12" cy="4.5" r="2.2"/><circle cx="5" cy="19" r="2.2"/><circle cx="19" cy="19" r="2.2"/><path d="M12 6.7v5.1M12 11.8 6.4 17.2M12 11.8l5.6 5.4"/>',

};
function ic(n,s){s=s||15;return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+IC[n]+'</svg>';}

/* ============================ 数据源 ============================ */
/* 页面分类：沿用 new_setting.html 的三分组 */
var PAGES=[
  {id:'general',   label:'常规',      icon:'gear',   group:'个人', desc:'工作区、模型、通知与执行策略'},
  {id:'models',    label:'模型',      icon:'cube',   group:'个人', desc:'按供应商管理模型，同供应商下切换 id 无需重填地址与密钥'},

  {id:'skills',    label:'技能',      icon:'bolt',   group:'扩展', desc:'项目技能目录与触发词'},
  {id:'builtin',   label:'插件',      icon:'puzzle', group:'扩展', desc:'进程内增强能力'},
  {id:'subagents', label:'子智能体',  icon:'nodes',  group:'扩展', desc:'多智能体协作的开关与能力边界'},
  {id:'mcp',       label:'MCP 服务',  icon:'hub',    group:'扩展', desc:'本地与远程 MCP 服务的注册与管理'},
  {id:'archived',  label:'归档',      icon:'box',    group:'数据', desc:'已归档的会话，满 10 天自动删除'}
];

/* 供应商库（真实数据取自 config/models.yaml，已按 base_url+key 归并） */
var PROVIDERS=[
  {id:'p-deepseek', name:'DeepSeek', on:true,
   base:'https://api.deepseek.com', fmt:'Chat Completions (/chat/completions)', proto:'openai',
   keySource:'plain', keyMask:'sk-4589••••••••••••••••••••••••db98', keyEnv:'',
   models:[{id:'deepseek-flash', name:'DeepSeekV4.1Flash', ctxIn:1040000, ctxOut:384000, on:true}],
   discover:['deepseek-chat','deepseek-reasoner','deepseek-v3.2-exp']},

  {id:'p-glm', name:'智谱 GLM', on:true,
   base:'https://open.bigmodel.cn/api/paas/v4', fmt:'Chat Completions (/chat/completions)', proto:'openai',
   keySource:'plain', keyMask:'c5c3d16f••••••••••••••••••••••', keyEnv:'',
   models:[{id:'glm-4.7-flash', name:'GLM4.7 Flash', ctxIn:200000, ctxOut:128000, on:true}],

/* ============================ 工具函数 ============================ */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(n){n=+n||0;if(n>=1000000)return (n/1000000).toFixed(2).replace(/\.?0+$/,'')+'M';if(n>=1000)return Math.round(n/1000)+'K';return String(n);}
function findProv(id){for(var i=0;i<PROVIDERS.length;i++){if(PROVIDERS[i].id===id)return PROVIDERS[i];}return null;}
function curModel(){
  var p=findProv(STATE.cur.p); if(!p)return null;
  for(var i=0;i<p.models.length;i++){if(p.models[i].id===STATE.cur.m)return {p:p,m:p.models[i]};}
  return null;
}
function isCur(pid,mid){return STATE.cur.p===pid&&STATE.cur.m===mid;}
function keyLabel(p){
  if(p.keySource==='env')return p.keyEnv?'环境变量 '+p.keyEnv:'未设置环境变量';
  return p.keyMask||'未设置密钥';
}
function sw(on,act,key){
  return '<label class="sw"><input type="checkbox"'+(on?' checked':'')+
    (act?' data-act="'+act+'" data-key="'+esc(key||'')+'"':' data-act="demo" data-msg="已切换（示例）"')+
    '><i></i></label>';
}

/* ============================ 渲染原语 ============================ */
function head(t,d){return '<div class="head"><h1>'+esc(t)+'</h1><p>'+esc(d)+'</p></div>';}
function row(kind,o){
  var c=ctlHTML(kind,o);
  var head_='<div class="m"><div class="t">'+esc(o.title)+(o.tag?'<span class="tag">'+esc(o.tag)+'</span>':'')+'</div>'+
    (o.desc?'<div class="d">'+esc(o.desc)+'</div>':'')+'</div>';
  return '<div class="rw">'+head_+(c?'<div class="ctl'+(kind==='slider'||kind==='buttons'?' grow':'')+'">'+c+'</div>':'')+'</div>';
}
function ctlHTML(kind,o){
  switch(kind){
    case 'static': return '<span class="val mono" title="'+esc(o.value)+'">'+esc(o.value)+'</span>';
    case 'switch': return sw(o.on);
    case 'slider': return '<div class="sld"><input type="range" min="'+o.min+'" max="'+o.max+'" step="'+o.step+'" value="'+o.val+'" data-act="range"><span class="v mono">'+o.val+o.unit+'</span></div>';
    case 'number': return '<label class="mini"><span class="lb">'+esc(o.label)+'</span><input class="inp n" type="number" value="'+o.val+'"'+(o.min!==undefined?' min="'+o.min+'"':'')+(o.max!==undefined?' max="'+o.max+'"':'')+'></label>';
    case 'select': return '<label class="mini"><span class="lb">'+esc(o.label)+'</span><span class="sel" style="width:200px"><select class="inp">'+o.opts.map(function(x){return '<option>'+esc(x)+'</option>';}).join('')+'</select>'+ic('chev',14)+'</span></label>';
    case 'seg': return '<div class="seg" data-seg="'+o.seg+'">'+o.opts.map(function(x,i){return '<button'+(i===o.active?' class="on"':'')+'>'+esc(x)+'</button>';}).join('')+'</div>';
    case 'buttons': return '<div class="bs" style="margin:0"><span class="rsp" data-slot="'+o.slot+'"></span>'+o.buttons.map(function(b){
        return '<button class="btn '+(b.cls||'')+'" data-act="save" data-slot="'+o.slot+'" data-msg="'+esc(b.msg)+'">'+esc(b.label)+'</button>';}).join('')+'</div>';
    case 'note': return '';
  }
  return '';
}
function fld(label,type,ph,opts){
  if(type==='select')return '<label class="f"><span class="lb">'+esc(label)+'</span><span class="sel"><select class="inp">'+
    opts.map(function(o){return '<option>'+esc(o)+'</option>';}).join('')+'</select>'+ic('chev',14)+'</span></label>';
  return '<label class="f"><span class="lb">'+esc(label)+'</span><input class="inp" type="text" placeholder="'+esc(ph||'')+'"></label>';
}

/* ============================ 装配 ============================ */
var navEl=document.getElementById('nav'), mainEl=document.getElementById('main'), toastEl=document.getElementById('toast');
var RENDER={general:pageGeneral,models:pageModels,appearance:pageAppearance,memory:pageMemory,
  skills:pageSkills,builtin:pageBuiltin,subagents:pageSubagents,mcp:pageMcp,archived:pageArchived};

function renderNav(){
  var g={};
  PAGES.forEach(function(p){(g[p.group]=g[p.group]||[]).push(p);});
  var h='<button class="nav-back" data-act="demo" data-msg="返回工作区（示例）">'+ic('back')+'<span>返回</span></button>';
  Object.keys(g).forEach(function(k){
    h+='<div class="ng">'+esc(k)+'</div>';
    h+=g[k].map(function(p){
      return '<button class="ni'+(STATE.page===p.id?' on':'')+'" data-act="go" data-page="'+p.id+'">'+ic(p.icon)+'<span>'+esc(p.label)+'</span></button>';
    }).join('');
  });
  navEl.innerHTML=h;
}
function renderMain(){
  mainEl.innerHTML='<div class="w">'+(RENDER[STATE.page]||pageGeneral)()+'</div>';
  mainEl.scrollTop=0;
}
function renderCurLabel(){
  var c=curModel();
  document.getElementById('cur-model-label').textContent=c?((c.m.name||c.m.id)+' · '+c.p.name):'未配置';
}
function render(){renderNav();renderMain();renderCurLabel();}

var toastT;
function toast(msg){
  toastEl.textContent=msg;toastEl.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('on');},1400);
}
function flash(slot,msg){
  var el=mainEl.querySelector('[data-slot="'+slot+'"]');
  if(!el)return;
  el.textContent=msg;
  setTimeout(function(){if(el.textContent===msg)el.textContent='';},1600);
}

/* 事件：统一委托，避免重渲染后失效 */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t)return;
  var act=t.dataset.act, key=t.dataset.key||'';

  if(act==='go'){ STATE.page=t.dataset.page; render(); return; }

  if(act==='tab'){ STATE.tab=t.dataset.tab; render(); return; }

  if(act==='pick-prov'){ STATE.prov=t.dataset.prov; render(); return; }

  if(act==='goto-add'){ STATE.amProv=t.dataset.prov||STATE.amProv; STATE.tab='add'; render(); return; }

  if(act==='setcur'){
    var a=key.split('|');
    STATE.cur={p:a[0],m:a[1]};
    render();
    var c=curModel();
    toast('已切换到 '+(c?(c.m.name||c.m.id):'')+'（示例）');
    return;
  }

  if(act==='toggle-model'){
    var b=key.split('|'), pp=findProv(b[0]);
    if(pp)for(var i=0;i<pp.models.length;i++){if(pp.models[i].id===b[1])pp.models[i].on=!pp.models[i].on;}
    render(); return;
  }

  if(act==='del-model'){
    var c2=key.split('|'), p2=findProv(c2[0]);
    if(p2){p2.models=p2.models.filter(function(m){return m.id!==c2[1];});}
    render(); toast('已删除模型（示例）'); return;
  }

  if(act==='batch-add'){
    var pid=t.dataset.prov, prov=findProv(pid);
    var boxes=mainEl.querySelectorAll('[data-disclist] input[type=checkbox]:checked');
    var ids=[];
    for(var j=0;j<boxes.length;j++)ids.push(boxes[j].value);
    if(!ids.length){flash(t.dataset.prov?'sup':'disc','请先勾选模型 id');return;}
    if(prov){
      ids.forEach(function(id){
        if(!prov.models.some(function(m){return m.id===id;})){
          prov.models.push({id:id,name:id,ctxIn:262144,ctxOut:131072,on:true});
        }
      });
      STATE.prov=prov.id; render();
      toast('已添加 '+ids.length+' 个模型（共用该供应商 Key）');
    }else{
      toast('已添加选中 '+ids.length+' 个模型（示例）');
    }
    return;
  }

  if(act==='save'){ flash(t.dataset.slot,t.dataset.msg||'已保存'); toast(t.dataset.msg||'已保存'); return; }

  if(act==='demo'){ toast(t.dataset.msg||'示例操作'); return; }
});

/* 输入类：change / input */
document.addEventListener('change',function(e){
  var t=e.target.closest('[data-act]');
  if(!t)return;
  if(t.dataset.act==='am-prov'){ STATE.amProv=t.value; render(); return; }
  if(t.dataset.act==='toggle-model'){ /* 已被 click 处理，避免重复 */ return; }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.matches&&t.matches('input[type=range][data-act=range]')){
    var out=t.parentElement.querySelector('.v');
    var unit=(out.textContent.match(/[^\d.-]+$/)||[''])[0];
    out.textContent=t.value+unit;
    return;
  }
  if(t.matches&&t.matches('[data-act=filter-disc]')){
    var q=t.value.toLowerCase(), box=t.closest('.pnl').querySelector('[data-disclist]');
    box.querySelectorAll('.pi').forEach(function(pi){
      pi.style.display=pi.querySelector('.id').textContent.toLowerCase().indexOf(q)>=0?'':'none';
    });
  }
});
/* 分段按钮 */
document.addEventListener('click',function(e){
  var b=e.target.closest('.seg button');
  if(!b)return;
  var seg=b.closest('.seg');
  seg.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
  b.classList.add('on');
});

render();
})();
</script>
